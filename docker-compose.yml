services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-nexora_rebuilt}
      MYSQL_USER: ${MYSQL_USER:-nexora}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-nexora_dev_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change_this_root_password}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - nexora_rebuilt_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  nexora_rebuilt_data:
